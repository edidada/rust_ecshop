name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Crypto dependency duplicates check
        shell: bash
        run: |
          if cargo tree -d | grep -E '^(sha2|hmac|digest|pbkdf2|sha1) v'; then
            echo "::error::Duplicate RustCrypto crates in dependency tree (trait versions would mismatch)"
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test --all-targets

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTTP and mock integration acceptance
        run: python scripts/http_acceptance.py
      - name: Upload HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-evidence-${{ matrix.os }}
          path: |
            target/http-server.log
            target/http-results.json
