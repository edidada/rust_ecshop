[package]
name = "rust_ecshop"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of PHP ECShop as a JSON REST API (axum + MySQL)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
pbkdf2 = "0.12"
once_cell = "1"
rbatis = "=4.7.2"
rbdc = "=4.7.0"
rbdc-mysql = "=4.7.1"
rbdc-sqlite = "=4.7.1"
rbs = "=4.7.0"
