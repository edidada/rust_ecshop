
[package]
name = "rust_ecshop_infra"
version = "0.1.0"
edition = "2021"
description = "Database and external implementations of the ECShop port: rbatis, dialect, crypto"

[dependencies]
rust_ecshop_domain = { path = "../rust_ecshop_domain" }
rbatis = "=4.7.2"
rbdc = "=4.7.0"
rbdc-mysql = "=4.7.1"
rbdc-sqlite = "=4.7.1"
rbs = "=4.7.0"
tokio = "1"
serde_json = "1"
anyhow = "1"
once_cell = "1"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.12"
hex = "0.4"
rand = "0.8"

tracing = "0.1"
